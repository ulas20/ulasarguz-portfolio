<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Smart Beauty iOS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020" />
      <stop offset="1" stop-color="#141b33" />
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="25%" r="55%">
      <stop offset="0" stop-color="#608dff" stop-opacity="0.4" />
      <stop offset="1" stop-color="#608dff" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.04" />
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)" />
  <rect width="1600" height="1000" fill="url(#grid)" />
  <rect width="1600" height="1000" fill="url(#glow)" />
  <g font-family="'Space Grotesk', Inter, system-ui, sans-serif" text-anchor="middle">
    <text x="800" y="480" font-size="72" font-weight="700" fill="#e9edf5">Smart Beauty iOS</text>
    <text x="800" y="545" font-size="26" font-weight="500" fill="#96a0b5" font-family="'JetBrains Mono', monospace">Swift · UIKit · REST API</text>
    <text x="800" y="640" font-size="20" fill="#5c677d" font-family="'JetBrains Mono', monospace">PLACEHOLDER — public/projects/smart-beauty.svg dosyasını gerçek görselle değiştirin</text>
  </g>
</svg>
